<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Zapowiedzi Meczowych</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116;
    --panel:#161b22;
    --panel2:#1d232c;
    --border:#2a323d;
    --text:#e8ecf1;
    --muted:#8a94a3;
    --accent:#3ddc84;
    --accent-dark:#2bb56b;
    --home:#4da3ff;
    --away:#ff6b6b;
    --danger:#ff5b5b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Oswald',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  .app{
    display:flex;
    flex-wrap:wrap;
    gap:24px;
    padding:24px;
    max-width:1500px;
    margin:0 auto;
  }
  .panel{
    flex:1 1 400px;
    max-width:460px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  h1{
    font-size:20px;
    margin:0 0 4px 0;
    letter-spacing:0.5px;
  }
  h1 span{color:var(--accent);}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
  }
  .card h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    margin:0 0 12px 0;
  }
  .row{
    display:flex;
    gap:10px;
  }
  .row > *{flex:1;}
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;
  }
  input[type=text], input[type=number], select{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    padding:9px 10px;
    font-family:'Oswald',sans-serif;
    font-size:14px;
    outline:none;
  }
  input[type=text]:focus, input[type=number]:focus, select:focus{
    border-color:var(--accent);
  }
  input[type=color]{
    -webkit-appearance:none;
    border:1px solid var(--border);
    border-radius:8px;
    height:38px;
    width:100%;
    padding:2px;
    background:var(--panel2);
    cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
  input[type=color]::-webkit-color-swatch{border:none;border-radius:6px;}
  input[type=range]{
    width:100%;
    accent-color:var(--accent);
    background:transparent;
    cursor:pointer;
  }
  .range-val{
    font-size:11px;
    color:var(--accent);
    float:right;
  }
  .field{margin-bottom:10px;}
  .field.checkbox-field{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:0;
  }
  .field.checkbox-field input{width:auto;}
  .field.checkbox-field label{margin:0;color:var(--text);font-size:13px;}
  .file-btn{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--panel2);
    border:1px dashed var(--border);
    border-radius:8px;
    padding:10px 12px;
    cursor:pointer;
    font-size:13px;
    color:var(--muted);
    transition:border-color .15s;
    margin-bottom:10px;
  }
  .file-btn:hover{border-color:var(--accent);}
  .file-btn input{display:none;}
  .file-btn .thumb{
    width:34px;height:34px;border-radius:6px;object-fit:contain;
    background:repeating-conic-gradient(#33393f 0 25%, #24282e 0 50%) 0/12px 12px;
    flex-shrink:0;
  }
  .logos-row{display:flex;gap:12px;}
  .logos-row .file-btn{flex:1; margin-bottom:0;}
  .side-tag{
    font-size:10px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.5px;
    padding:2px 6px;
    border-radius:4px;
  }
  .side-tag.home{background:rgba(77,163,255,.15);color:var(--home);}
  .side-tag.away{background:rgba(255,107,107,.15);color:var(--away);}
  button.primary{
    width:100%;
    background:var(--accent);
    color:#08130c;
    border:none;
    border-radius:8px;
    padding:11px 0;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.3px;
    cursor:pointer;
    transition:background .15s;
  }
  button.primary:hover{background:var(--accent-dark);}
  button.download{
    padding:16px 0;
    font-size:16px;
  }
  .preview-col{
    flex:1 1 420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    position:sticky;
    top:24px;
    align-self:flex-start;
  }
  .canvas-wrap{
    width:100%;
    max-width:430px;
    aspect-ratio:1080/1440;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--border);
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  #canvas{
    width:100%;
    height:100%;
    display:block;
    background:#20242b;
  }
  .preview-col .actions{
    width:100%;
    max-width:430px;
  }
  .footnote{
    font-size:11px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>

<div class="app">

  <!-- LEWA STRONA: PANEL STEROWANIA -->
  <div class="panel">
    <h1>Generator <span>Zapowiedzi</span> Meczowych</h1>

    <div class="card">
      <h2>1. Zdjęcia i Herby</h2>
      <label class="file-btn" id="bgFileBtn">
        <img class="thumb" id="bgThumb" src="" style="display:none;">
        <span id="bgFileLabel">Wgraj zdjęcie z meczu (JPG/PNG)</span>
        <input type="file" id="bgFile" accept="image/*">
      </label>
      <div class="logos-row">
        <label class="file-btn" id="homeLogoBtn">
          <img class="thumb" id="homeLogoThumb" src="" style="display:none;">
          <span>Gospodarze <span class="side-tag home">HOME</span></span>
          <input type="file" id="homeLogoFile" accept="image/png,image/*">
        </label>
        <label class="file-btn" id="awayLogoBtn">
          <img class="thumb" id="awayLogoThumb" src="" style="display:none;">
          <span>Goście <span class="side-tag away">AWAY</span></span>
          <input type="file" id="awayLogoFile" accept="image/png,image/*">
        </label>
      </div>
    </div>

    <div class="card">
      <h2>2. Nagłówki i Social Media</h2>
      <div class="field">
        <label>Nazwa rozgrywek (etykieta na ramce)</label>
        <input type="text" id="competition" value="MECZ" maxlength="30">
      </div>
      <div class="row">
        <div class="field">
          <label>Napis z prawej (np. Zapowiedź)</label>
          <input type="text" id="topRightText" value="ZAPOWIEDŹ" maxlength="15">
        </div>
        <div class="field">
          <label>Napis na środku (np. GRAMY!)</label>
          <input type="text" id="topCenterText" value="MATCHDAY" maxlength="15">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>Instagram</label>
          <input type="text" id="watermark" value="twoja-nazwa" maxlength="25">
        </div>
        <div class="field">
          <label>Facebook</label>
          <input type="text" id="fbWatermark" value="twoja-nazwa" maxlength="25">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>3. Drużyny i status</h2>
      <div class="field">
        <label>Napis pomiędzy herbami (zamiast wyniku)</label>
        <input type="text" id="vsText" value="VS" maxlength="5">
      </div>
      <div class="row">
        <div class="field">
          <label>Nazwa gospodarzy</label>
          <input type="text" id="homeName" value="GOSPODARZE" maxlength="25">
        </div>
        <div class="field">
          <label>Nazwa gości</label>
          <input type="text" id="awayName" value="GOŚCIE" maxlength="25">
        </div>
      </div>
      <div class="field checkbox-field" style="margin-top:6px;">
        <input type="checkbox" id="showNames" checked>
        <label for="showNames">Pokaż nazwy drużyn pod herbami</label>
      </div>
    </div>

    <div class="card">
      <h2>4. Szczegóły Meczu (Pod herbami)</h2>
      <div class="field">
        <label>🗓️ Data meczu (Dzień i Data)</label>
        <input type="text" id="detDate" value="Data" maxlength="40">
      </div>
      <div class="field">
        <label>⏰ Godzina meczu</label>
        <input type="text" id="detTime" value="Godzina" maxlength="40">
      </div>
      <div class="field">
        <label>🏟️ Miejsce meczu (Stadion)</label>
        <input type="text" id="detLoc" value="Adres" maxlength="50">
      </div>
    </div>

    <div class="card">
      <h2>5. Pasek Sponsorów (Szer: 990-1920px | Wys: 100-150px)</h2>
      <div class="field checkbox-field" style="margin-bottom:12px;">
        <input type="checkbox" id="showSponsors" checked>
        <label for="showSponsors">Pokaż pasek sponsorów na dole</label>
      </div>
      <label class="file-btn" id="sponsorFileBtn" style="margin-bottom:0;">
        <img class="thumb" id="sponsorThumb" src="" style="display:none;">
        <span id="sponsorFileLabel">Wgraj plik z logami sponsorów (Dół)</span>
        <input type="file" id="sponsorFile" accept="image/*">
      </label>
      <div class="field" style="margin-top:10px;">
        <label>Wysokość paska ze sponsorami: <span class="range-val" id="sponsorHeightVal">120 px</span></label>
        <input type="range" id="sponsorHeight" min="50" max="300" step="10" value="120">
      </div>
    </div>

    <!-- SEKCJA GRADIENTÓW W ROGACH -->
    <div class="card">
      <h2>6. Gradienty i poświaty w rogach</h2>
      <div class="field checkbox-field" style="margin-bottom:12px;">
        <input type="checkbox" id="enableCornerGlow" checked>
        <label for="enableCornerGlow">Włącz poświaty w narożnikach</label>
      </div>
      <div class="row">
        <div class="field">
          <label>Poświata Gospodarzy</label>
          <input type="color" id="homeGlowColor" value="#4da3ff">
        </div>
        <div class="field">
          <label>Poświata Gości</label>
          <input type="color" id="awayGlowColor" value="#ff6b6b">
        </div>
      </div>
      <div class="field">
        <label>Promień poświaty: <span class="range-val" id="glowRadiusVal">600 px</span></label>
        <input type="range" id="glowRadius" min="200" max="1000" step="20" value="600">
      </div>
      <div class="field">
        <label>Przezroczystość poświaty: <span class="range-val" id="glowOpacityVal">45%</span></label>
        <input type="range" id="glowOpacity" min="0" max="1" step="0.05" value="0.45">
      </div>
    </div>

    <!-- SEKCJA KASTOMIZACJI WYGLĄDU -->
    <div class="card">
      <h2>7. Kastomizacja wyglądu</h2>

      <div class="row">
        <div class="field">
          <label>Kolor ramki</label>
          <input type="color" id="borderColor" value="#ffffff">
        </div>
        <div class="field">
          <label>Kolor tekstu</label>
          <input type="color" id="textColor" value="#ffffff">
        </div>
        <div class="field">
          <label>Kolor cienia</label>
          <input type="color" id="shadowColor" value="#000000">
        </div>
      </div>

      <div class="field">
        <label>Grubość ramki: <span class="range-val" id="borderWidthVal">2.5 px</span></label>
        <input type="range" id="borderWidth" min="0" max="10" step="0.5" value="2.5">
      </div>

      <div class="field">
        <label>Intensywność cienia: <span class="range-val" id="shadowBlurVal">12 px</span></label>
        <input type="range" id="shadowBlur" min="0" max="40" step="1" value="12">
      </div>

      <div class="field">
        <label>Przyciemnienie tła: <span class="range-val" id="overlayOpacityVal">62%</span></label>
        <input type="range" id="overlayOpacity" min="0" max="1" step="0.05" value="0.62">
      </div>

      <div class="field">
        <label>Rozmiar herbów: <span class="range-val" id="crestSizeVal">180 px</span></label>
        <input type="range" id="crestSize" min="80" max="300" step="5" value="180">
      </div>

      <div class="field">
        <label>Rozmiar czcionki VS: <span class="range-val" id="scoreFontSizeVal">128 px</span></label>
        <input type="range" id="scoreFontSize" min="60" max="180" step="4" value="128">
      </div>

      <div class="field">
        <label>Rozmiar tekstu szczegółów: <span class="range-val" id="eventFontSizeVal">32 px</span></label>
        <input type="range" id="eventFontSize" min="18" max="50" step="1" value="32">
      </div>

      <div class="field">
        <label>Zaokrąglenie narożników: <span class="range-val" id="boxRadiusVal">32 px</span></label>
        <input type="range" id="boxRadius" min="0" max="60" step="2" value="32">
      </div>

      <button type="button" class="primary" id="resetCustomizationBtn" style="background:var(--panel2);color:var(--text);border:1px solid var(--border);margin-top:6px;">↺ Przywróć domyślne</button>
    </div>

  </div>

  <!-- PRAWA STRONA: PODGLĄD -->
  <div class="preview-col">
    <div class="canvas-wrap">
      <canvas id="canvas" width="1080" height="1440"></canvas>
    </div>
    <div class="actions">
      <button class="primary download" id="downloadBtn">⬇ Pobierz grafikę (PNG 1080×1440)</button>
    </div>
    <div class="footnote">Podgląd aktualizuje się automatycznie.</div>
  </div>

</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = 1080;
  const H = 1440;

  const state = {
    bgImage: null,
    homeLogo: null,
    awayLogo: null,
    sponsorImage: null
  };

  const APPLE_EMOJI_URLS = {
    calendar: 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.0.1/img/apple/64/1f4c5.png',
    clock: 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.0.1/img/apple/64/23f0.png',
    stadium: 'https://cdn.jsdelivr.net/npm/emoji-datasource-apple@15.0.1/img/apple/64/1f3df-fe0f.png'
  };

  const emojiImages = {};
  Object.keys(APPLE_EMOJI_URLS).forEach(key => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function(){ safeRender(); };
    img.src = APPLE_EMOJI_URLS[key];
    emojiImages[key] = img;
  });

  function hexToRgba(hex, alpha) {
    if(!hex) return `rgba(0,0,0,${alpha})`;
    hex = hex.replace('#', '');
    if(hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const num = parseInt(hex, 16);
    if(isNaN(num)) return `rgba(0,0,0,${alpha})`;
    return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
  }

  function loadImageFromFile(file, callback){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){ callback(img); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function drawCover(ctx, img, x, y, w, h){
    const imgRatio = img.width / img.height;
    const boxRatio = w / h;
    let sx, sy, sw, sh;
    if(imgRatio > boxRatio){
      sh = img.height;
      sw = sh * boxRatio;
      sx = (img.width - sw) / 2;
      sy = 0;
    } else {
      sw = img.width;
      sh = sw / boxRatio;
      sx = 0;
      sy = (img.height - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function drawContain(ctx, img, x, y, w, h){
    const imgRatio = img.width / img.height;
    const boxRatio = w / h;
    let dw, dh;
    if(imgRatio > boxRatio){
      dw = w;
      dh = w / imgRatio;
    } else {
      dh = h;
      dw = h * imgRatio;
    }
    const dx = x + (w - dw)/2;
    const dy = y + (h - dh)/2;
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function strokeBoxWithLegendGap(ctx, x, y, w, h, r, gapCenterX, gapHalfWidth){
    ctx.beginPath();
    ctx.moveTo(gapCenterX + gapHalfWidth, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r);
    ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
    ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.lineTo(gapCenterX - gapHalfWidth, y);
    ctx.stroke();
  }

  function drawRoundedRect(ctx, x, y, width, height, radius) {
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + width - radius, y);
    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
    ctx.lineTo(x + width, y + height - radius);
    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
    ctx.lineTo(x + radius, y + height);
    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  function updateRangeLabels(){
    const getVal = id => document.getElementById(id) ? document.getElementById(id).value : '';
    if(document.getElementById('borderWidthVal')) document.getElementById('borderWidthVal').textContent = getVal('borderWidth') + ' px';
    if(document.getElementById('shadowBlurVal')) document.getElementById('shadowBlurVal').textContent = getVal('shadowBlur') + ' px';
    if(document.getElementById('overlayOpacityVal')) document.getElementById('overlayOpacityVal').textContent = Math.round((parseFloat(getVal('overlayOpacity'))||0) * 100) + '%';
    if(document.getElementById('crestSizeVal')) document.getElementById('crestSizeVal').textContent = getVal('crestSize') + ' px';
    if(document.getElementById('scoreFontSizeVal')) document.getElementById('scoreFontSizeVal').textContent = getVal('scoreFontSize') + ' px';
    if(document.getElementById('eventFontSizeVal')) document.getElementById('eventFontSizeVal').textContent = getVal('eventFontSize') + ' px';
    if(document.getElementById('boxRadiusVal')) document.getElementById('boxRadiusVal').textContent = getVal('boxRadius') + ' px';
    if(document.getElementById('glowRadiusVal')) document.getElementById('glowRadiusVal').textContent = getVal('glowRadius') + ' px';
    if(document.getElementById('glowOpacityVal')) document.getElementById('glowOpacityVal').textContent = Math.round((parseFloat(getVal('glowOpacity'))||0) * 100) + '%';
    if(document.getElementById('sponsorHeightVal')) document.getElementById('sponsorHeightVal').textContent = getVal('sponsorHeight') + ' px';
  }

  function render(){
    updateRangeLabels();
    ctx.clearRect(0,0,W,H);

    const borderColor = document.getElementById('borderColor').value || '#ffffff';
    const textColor = document.getElementById('textColor').value || '#ffffff';
    const shadowColor = document.getElementById('shadowColor').value || '#000000';
    const borderWidth = parseFloat(document.getElementById('borderWidth').value) || 2.5;
    const shadowBlurVal = parseInt(document.getElementById('shadowBlur').value, 10) || 12;
    const overlayOpacity = parseFloat(document.getElementById('overlayOpacity').value) || 0.62;
    const crestSize = parseInt(document.getElementById('crestSize').value, 10) || 180;
    const scoreFontSize = parseInt(document.getElementById('scoreFontSize').value, 10) || 128;
    const eventFontSize = parseInt(document.getElementById('eventFontSize').value, 10) || 32;
    const boxRadius = parseInt(document.getElementById('boxRadius').value, 10) || 32;
    const sponsorHeight = parseInt(document.getElementById('sponsorHeight').value, 10) || 120;
    const showSponsors = document.getElementById('showSponsors').checked;

    // 1. Tło
    if(state.bgImage){
      drawCover(ctx, state.bgImage, 0, 0, W, H);
    } else {
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#2c333d');
      g.addColorStop(1,'#12151a');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);
    }

    // 2. Gradienty narożnikowe
    const enableGlow = document.getElementById('enableCornerGlow').checked;
    if(enableGlow) {
      const homeGlowColor = document.getElementById('homeGlowColor').value;
      const awayGlowColor = document.getElementById('awayGlowColor').value;
      const glowRadius = parseInt(document.getElementById('glowRadius').value, 10) || 600;
      const glowOpacity = parseFloat(document.getElementById('glowOpacity').value) || 0.45;

      ctx.save();
      const gHome = ctx.createRadialGradient(0, H, 0, 0, H, glowRadius);
      gHome.addColorStop(0, hexToRgba(homeGlowColor, glowOpacity));
      gHome.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gHome;
      ctx.fillRect(0, 0, W, H);

      const gAway = ctx.createRadialGradient(W, H, 0, W, H, glowRadius);
      gAway.addColorStop(0, hexToRgba(awayGlowColor, glowOpacity));
      gAway.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gAway;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 3. Przyciemnienie tła
    const overlay = ctx.createLinearGradient(0,0,0,H);
    overlay.addColorStop(0,    `rgba(0,0,0,${(overlayOpacity * 0.35).toFixed(2)})`);
    overlay.addColorStop(0.55, `rgba(0,0,0,${(overlayOpacity * 0.32).toFixed(2)})`);
    overlay.addColorStop(0.72, `rgba(0,0,0,${(overlayOpacity * 0.65).toFixed(2)})`);
    overlay.addColorStop(1,    `rgba(0,0,0,${overlayOpacity.toFixed(2)})`);
    ctx.fillStyle = overlay;
    ctx.fillRect(0,0,W,H);

    // 4. Social Media Logos (Lewa strona u góry)
    const watermark = document.getElementById('watermark').value.trim();
    const fbWatermark = document.getElementById('fbWatermark').value.trim();
    let currentTopY = 50;

    if(watermark){
      ctx.save();
      const igX = 52;
      const igY = currentTopY;
      const igSize = 34;

      ctx.strokeStyle = textColor;
      ctx.fillStyle = textColor;
      ctx.lineWidth = 3;
      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = shadowBlurVal;

      drawRoundedRect(ctx, igX, igY, igSize, igSize, 9);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(igX + igSize/2, igY + igSize/2, 7.5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(igX + igSize - 8, igY + 8, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = "600 28px 'Oswald', sans-serif";
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(watermark, igX + igSize + 12, igY + igSize/2 + 2);
      ctx.restore();

      currentTopY += 46;
    }

    if(fbWatermark){
      ctx.save();
      const fbX = 52;
      const fbY = currentTopY;
      const fbSize = 34;

      ctx.strokeStyle = textColor;
      ctx.fillStyle = textColor;
      ctx.lineWidth = 3;
      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = shadowBlurVal;

      drawRoundedRect(ctx, fbX, fbY, fbSize, fbSize, 9);
      ctx.stroke();

      ctx.font = "bold 24px sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('f', fbX + fbSize*0.62, fbY + fbSize*0.56);

      ctx.font = "600 28px 'Oswald', sans-serif";
      ctx.textAlign = 'left';
      ctx.fillText(fbWatermark, fbX + fbSize + 12, fbY + fbSize/2 + 2);
      ctx.restore();
    }

    // 5. Napisy górne (Środek i Prawa strona)
    const topCenterText = document.getElementById('topCenterText').value.trim();
    if(topCenterText){
      ctx.save();
      ctx.fillStyle = textColor;
      ctx.font = "600 32px 'Oswald', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = shadowBlurVal;
      ctx.fillText(topCenterText, W / 2, 48);
      ctx.restore();
    }

    const topRightText = document.getElementById('topRightText').value.trim();
    if(topRightText){
      ctx.save();
      ctx.fillStyle = textColor;
      ctx.font = "600 28px 'Oswald', sans-serif";
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = shadowBlurVal;
      ctx.fillText(topRightText, W - 52, 50);
      ctx.restore();
    }

    // 6. Pasek sponsorów (na dole, sterowany checkboxem)
    let dynamicBottomMargin = 45; // domyślny margines dolny dla ramki
    const hasActiveSponsors = showSponsors && state.sponsorImage;
    if(hasActiveSponsors){
      const sponsorY = H - sponsorHeight;
      // Białe tło dla sponsorów
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, sponsorY, W, sponsorHeight);
      
      const pad = 15;
      drawContain(ctx, state.sponsorImage, pad, sponsorY + pad, W - (pad*2), sponsorHeight - (pad*2));
      
      dynamicBottomMargin = sponsorHeight + 35; // podnosimy ramkę
    }

    // 7. Podpis autorski (Prawy róg, nad sponsorami)
    ctx.save();
    ctx.fillStyle = textColor;
    ctx.globalAlpha = 0.55;
    ctx.font = "400 20px 'Oswald', sans-serif";
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    // Jeśli są sponsorzy, tekst przenosimy lekko wyżej, żeby był na ciemnym tle
    ctx.fillText('made by @ksajen._', W - 45, H - (hasActiveSponsors ? sponsorHeight + 10 : 16));
    ctx.restore();

    // Dane do ramki
    const competition = (document.getElementById('competition').value || '').toUpperCase();
    const homeName = (document.getElementById('homeName').value || 'GOSPODARZE').toUpperCase();
    const awayName = (document.getElementById('awayName').value || 'GOŚCIE').toUpperCase();
    const vsText = document.getElementById('vsText').value || 'VS';
    const showNames = document.getElementById('showNames').checked;

    // Szczegóły
    const details = [
      { id: 'calendar', val: document.getElementById('detDate').value.trim() },
      { id: 'clock', val: document.getElementById('detTime').value.trim() },
      { id: 'stadium', val: document.getElementById('detLoc').value.trim() }
    ].filter(d => d.val !== '');

    const boxX = 45;
    const boxW = W - boxX * 2;
    const centerX = W / 2;

    const headerH = 74;
    const scoreRowH = Math.max(crestSize, scoreFontSize) + 40;
    const namesH = showNames ? 54 : 0;
    const detailsTopPad = details.length > 0 ? 30 : 8;
    const detailRowH = Math.max(50, Math.round(eventFontSize * 1.8));
    const detailsBottomPad = 40;

    const boxH = headerH + scoreRowH + namesH + detailsTopPad + (details.length * detailRowH) + detailsBottomPad;
    const boxBottom = H - dynamicBottomMargin;
    const boxTop = boxBottom - boxH;

    // 8. Etykieta na ramce
    ctx.font = "600 30px 'Oswald', sans-serif";
    const labelText = competition;
    const labelWidth = ctx.measureText(labelText).width;
    const gapHalfWidth = labelWidth > 0 ? (labelWidth / 2 + 20) : 0;

    // 9. Obrys ramki
    ctx.save();
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = borderWidth;
    ctx.shadowColor = shadowColor;
    ctx.shadowBlur = shadowBlurVal;
    if(gapHalfWidth > 0) {
      strokeBoxWithLegendGap(ctx, boxX, boxTop, boxW, boxH, boxRadius, centerX, gapHalfWidth);
    } else {
      drawRoundedRect(ctx, boxX, boxTop, boxW, boxH, boxRadius);
      ctx.stroke();
    }
    ctx.restore();

    // 10. Napis w przerwie ramki
    if(labelText) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = borderColor;
      ctx.font = "600 30px 'Oswald', sans-serif";
      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = shadowBlurVal;
      ctx.fillText(labelText, centerX, boxTop + 1);
      ctx.restore();
    }

    // 11. Herby + napis VS na środku
    const scoreCenterY = boxTop + headerH + scoreRowH / 2;
    const homeCrestX = boxX + 160;
    const awayCrestX = boxX + boxW - 160;

    ctx.save();
    ctx.shadowColor = shadowColor;
    ctx.shadowBlur = shadowBlurVal;
    if(state.homeLogo){
      drawContain(ctx, state.homeLogo, homeCrestX - crestSize/2, scoreCenterY - crestSize/2, crestSize, crestSize);
    }
    if(state.awayLogo){
      drawContain(ctx, state.awayLogo, awayCrestX - crestSize/2, scoreCenterY - crestSize/2, crestSize, crestSize);
    }
    ctx.restore();

    // Napis VS (używamy czcionki Anton, tak samo jak w przypadku wyniku)
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = textColor;
    ctx.font = `${scoreFontSize}px 'Anton', sans-serif`;
    ctx.shadowColor = shadowColor;
    ctx.shadowBlur = shadowBlurVal;
    ctx.fillText(vsText, centerX, scoreCenterY + 6);
    ctx.restore();

    // 12. Nazwy drużyn pod herbami
    if(showNames){
      const namesY = scoreCenterY + Math.max(crestSize, scoreFontSize)/2 + 28;
      ctx.save();
      ctx.font = "600 26px 'Oswald', sans-serif";
      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = shadowBlurVal;
      ctx.fillText(homeName, homeCrestX, namesY);
      ctx.fillText(awayName, awayCrestX, namesY);
      ctx.restore();
    }

    // 13. Szczegóły meczu (lista pod herbami)
    const detailsTop = boxTop + headerH + scoreRowH + namesH + detailsTopPad;
    const detailFont = `500 ${eventFontSize}px 'Oswald', sans-serif`;
    const iconDisplaySize = Math.round(eventFontSize * 1.3);

    ctx.textBaseline = 'middle';

    details.forEach((det, i) => {
      const y = detailsTop + i * detailRowH + detailRowH/2;
      const iconImg = emojiImages[det.id];
      
      ctx.save();
      ctx.font = detailFont;
      const textW = ctx.measureText(det.val).width;
      
      // Układamy na środku: [Ikona] [Tekst]
      const totalW = iconDisplaySize + 15 + textW;
      const startX = centerX - totalW / 2;

      if(iconImg && iconImg.complete && iconImg.naturalWidth !== 0){
        ctx.drawImage(iconImg, startX, y - iconDisplaySize/2, iconDisplaySize, iconDisplaySize);
      }

      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = shadowBlurVal;
      ctx.textAlign = 'left';
      ctx.fillStyle = textColor;
      ctx.fillText(det.val, startX + iconDisplaySize + 15, y);
      ctx.restore();
    });
  }

  function safeRender() {
    try {
      render();
    } catch(err) {
      console.error("Błąd podczas renderowania:", err);
    }
  }

  // Obsługa plików
  const filesSetup = [
    { id: 'bgFile', stateKey: 'bgImage', thumbId: 'bgThumb', labelId: 'bgFileLabel' },
    { id: 'homeLogoFile', stateKey: 'homeLogo', thumbId: 'homeLogoThumb', labelId: null },
    { id: 'awayLogoFile', stateKey: 'awayLogo', thumbId: 'awayLogoThumb', labelId: null },
    { id: 'sponsorFile', stateKey: 'sponsorImage', thumbId: 'sponsorThumb', labelId: 'sponsorFileLabel' }
  ];

  filesSetup.forEach(cfg => {
    document.getElementById(cfg.id).addEventListener('change', e => {
      const file = e.target.files[0];
      if(!file) return;
      loadImageFromFile(file, img => {
        state[cfg.stateKey] = img;
        document.getElementById(cfg.thumbId).src = img.src;
        document.getElementById(cfg.thumbId).style.display = 'block';
        if(cfg.labelId) {
          document.getElementById(cfg.labelId).textContent = file.name;
        }
        safeRender();
      });
    });
  });

  const allInputs = [
    'competition','topRightText','topCenterText','watermark','fbWatermark',
    'vsText','homeName','awayName','showNames','detDate','detTime','detLoc',
    'borderColor','textColor','shadowColor','borderWidth','shadowBlur','overlayOpacity',
    'crestSize','scoreFontSize','eventFontSize','boxRadius','sponsorHeight',
    'enableCornerGlow','homeGlowColor','awayGlowColor','glowRadius','glowOpacity',
    'showSponsors'
  ];

  allInputs.forEach(id => {
    const el = document.getElementById(id);
    if(el){
      el.addEventListener('input', safeRender);
      el.addEventListener('change', safeRender);
    }
  });

  document.getElementById('resetCustomizationBtn').addEventListener('click', () => {
    document.getElementById('borderColor').value = '#ffffff';
    document.getElementById('textColor').value = '#ffffff';
    document.getElementById('shadowColor').value = '#000000';
    document.getElementById('borderWidth').value = '2.5';
    document.getElementById('shadowBlur').value = '12';
    document.getElementById('overlayOpacity').value = '0.62';
    document.getElementById('crestSize').value = '180';
    document.getElementById('scoreFontSize').value = '128';
    document.getElementById('eventFontSize').value = '32';
    document.getElementById('boxRadius').value = '32';
    document.getElementById('sponsorHeight').value = '120';
    document.getElementById('showSponsors').checked = true;
    document.getElementById('enableCornerGlow').checked = true;
    document.getElementById('homeGlowColor').value = '#4da3ff';
    document.getElementById('awayGlowColor').value = '#ff6b6b';
    document.getElementById('glowRadius').value = '600';
    document.getElementById('glowOpacity').value = '0.45';
    safeRender();
  });

  // Obsługa pobierania
  document.getElementById('downloadBtn').addEventListener('click', () => {
    try {
      const link = document.createElement('a');
      const home = (document.getElementById('homeName').value || 'gospodarze').trim();
      const away = (document.getElementById('awayName').value || 'goscie').trim();
      const safe = s => s.toLowerCase().replace(/[^a-z0-9ąćęłńóśźż]+/gi,'-');
      link.download = `zapowiedz-${safe(home)}-vs-${safe(away)}.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    } catch(e) {
      console.error("Błąd podczas generowania pliku:", e);
      alert("Nie udało się pobrać pliku: " + e.message);
    }
  });

  // Inicjalizacja
  safeRender();
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(safeRender);
  }
})();
</script>
</body>
</html>
