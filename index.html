<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generatory Meczowe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116;
    --panel:#161b22;
    --panel2:#1d232c;
    --border:#2a323d;
    --text:#e8ecf1;
    --muted:#8a94a3;
    --accent:#3ddc84;
    --accent-dark:#2bb56b;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:'Oswald',sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .app-shell{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  .tabbar{
    display:flex;
    gap:8px;
    padding:14px 20px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .tabbar h1{
    font-size:15px;
    margin:0 16px 0 0;
    display:flex;
    align-items:center;
    letter-spacing:0.5px;
    color:var(--muted);
    font-weight:500;
  }
  .tabbar h1 span{color:var(--accent);}
  .tab-btn{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--muted);
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-family:'Oswald',sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.3px;
    transition:.15s;
  }
  .tab-btn:hover{border-color:var(--accent);}
  .tab-btn.active{
    background:rgba(61,220,132,.15);
    border-color:var(--accent);
    color:var(--accent);
  }
  .frames{
    position:relative;
    flex:1;
    min-height:0;
  }
  .frame-wrap{
    position:absolute;
    inset:0;
    display:none;
  }
  .frame-wrap.active{display:block;}
  iframe{
    width:100%;
    height:100%;
    border:none;
    background:var(--bg);
  }
</style>
</head>
<body>
<div class="app-shell">
  <div class="tabbar">
    <h1>Generatory <span>Meczowe</span></h1>
    <button class="tab-btn active" data-tab="podsumowanie">Podsumowanie meczu</button>
    <button class="tab-btn" data-tab="zapowiedzi">Zapowiedzi meczowe</button>
  </div>
  <div class="frames">
    <div class="frame-wrap active" id="wrap-podsumowanie">
      <iframe src="PODSUMOWANIE_MECZY.html" title="Generator Podsumowań Meczowych"></iframe>
    </div>
    <div class="frame-wrap" id="wrap-zapowiedzi">
      <iframe src="ZAPOWIEDZI_MECZOWE.html" title="Generator Zapowiedzi Meczowych"></iframe>
    </div>
  </div>
</div>
<script>
  const buttons = document.querySelectorAll('.tab-btn');
  const wraps = {
    podsumowanie: document.getElementById('wrap-podsumowanie'),
    zapowiedzi: document.getElementById('wrap-zapowiedzi')
  };
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(wraps).forEach(w => w.classList.remove('active'));
      wraps[btn.dataset.tab].classList.add('active');
    });
  });
</script>
</body>
</html>
